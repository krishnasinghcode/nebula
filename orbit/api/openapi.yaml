openapi: 3.1.0
info:
  title: Nebula Orbit API
  version: "0.1.0"
  description: >-
    Control-plane API for Orbit, Nebula's compute service. Localhost-only;
    bearer-token authenticated. Generated TypeScript clients consume this spec
    (ADR-0001). MVP subset: instance lifecycle. Keys/volumes/networking arrive
    in later phases per docs/features/orbit/design/implementation-plan.md.
servers:
  - url: http://127.0.0.1:7420/v1
security:
  - bearerAuth: []
paths:
  /images:
    get:
      summary: List curated images (read-only catalogue)
      responses:
        "200": { description: "OK; content: array of Image" }
        "401": { $ref: "#/components/responses/Error" }
  /instance-types:
    get:
      summary: List instance types (read-only catalogue)
      responses:
        "200": { description: "OK; content: array of InstanceType" }
        "401": { $ref: "#/components/responses/Error" }
  /capacity:
    get:
      summary: Capacity ledger (host envelope, usage, quotas)
      responses:
        "200": { description: "OK; content: Capacity" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /keys:
    post:
      summary: Register a public SSH key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, public_key]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]{2,30}$" }
                public_key: { type: string, description: "OpenSSH-format public key" }
      responses:
        "201": { description: "Created; content: SSHKey" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      summary: List registered keys
      responses:
        "200": { description: "OK; content: array of SSHKey" }
        "401": { $ref: "#/components/responses/Error" }
  /keys/{name}:
    get:
      summary: Get a key
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OK; content: SSHKey" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a key (rejected while referenced by an instance)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /instances:
    post:
      summary: Create an instance (async provisioning)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstanceRequest" }
      responses:
        "202": { description: "Accepted; instance is provisioning; content: Instance" }
        "200": { description: "Idempotent replay of an existing live instance; content: Instance" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      summary: List instances
      parameters:
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200": { description: "OK; content: array of Instance" }
  /instances/{id}:
    get:
      summary: Describe an instance (with lifecycle events)
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
  /instances/{id}/start:
    post: { summary: Start a stopped instance, parameters: [{ $ref: "#/components/parameters/InstanceId" }], responses: { "202": { description: Accepted }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } } }
  /instances/{id}/stop:
    post: { summary: Stop a running instance, parameters: [{ $ref: "#/components/parameters/InstanceId" }], responses: { "202": { description: Accepted }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } } }
  /instances/{id}/reboot:
    post: { summary: Reboot a running instance, parameters: [{ $ref: "#/components/parameters/InstanceId" }], responses: { "202": { description: Accepted }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } } }
  /instances/{id}/terminate:
    post:
      summary: Terminate an instance (irreversible)
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keep_root_volume: { type: boolean, default: false, description: "Keep the named root data volume (orbit-<id>)" }
      responses:
        "202": { description: Accepted; terminating }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /instances/{id}/events:
    get:
      summary: Instance lifecycle events
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
  /instances/{id}/ports:
    put:
      summary: Replace published ports (stopped instances only; unit recreated on next start)
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ports: { type: array, items: { $ref: "#/components/schemas/Port" } }
      responses:
        "200": { description: "OK; content: Instance" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Image:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        os: { type: string }
        description: { type: string }
        size_estimate: { type: string }
    InstanceType:
      type: object
      properties:
        id: { type: string }
        vcpu: { type: number }
        memory_mb: { type: integer }
        description: { type: string }
    SSHKey:
      type: object
      properties:
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }
    Capacity:
      type: object
      properties:
        host:
          type: object
          properties:
            total_cpus: { type: number }
            total_memory_mb: { type: integer }
            schedulable_cpus: { type: number }
            schedulable_memory_mb: { type: integer }
        used_cpus: { type: number }
        used_memory_mb: { type: integer }
        instances: { type: integer }
        max_instances: { type: integer }
        quota_memory_mb: { type: integer }
        used_volume_mb: { type: integer }
        quota_volume_mb: { type: integer }
        subnet: { type: string }
        network:
          type: object
          properties:
            name: { type: string }
            subnet: { type: string }
            note: { type: string }
    Port:
      type: object
      required: [instance_port, host_port, bind]
      properties:
        instance_port: { type: integer }
        host_port: { type: integer, description: "0 = auto-allocated by the runtime; resolved value appears on describe" }
        bind: { type: string, enum: [loopback, all], default: loopback }
    CreateInstanceRequest:
      type: object
      required: [name, image_id, type_id, key_id]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{2,30}$" }
        image_id: { type: string }
        type_id: { type: string }
        key_id: { type: string }
        user_data: { type: string, maxLength: 16384 }
        ports: { type: array, items: { $ref: "#/components/schemas/Port" } }
        idempotency_token: { type: string }
    Instance:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        state:
          type: string
          enum: [provisioning, running, stopping, stopped, rebooting, failed, terminating, terminated]
        image_id: { type: string }
        type_id: { type: string }
        key_id: { type: string }
        private_ip: { type: string }
        ports: { type: array, items: { $ref: "#/components/schemas/Port" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        transition_error: { type: string }
    Event:
      type: object
      properties:
        id: { type: integer }
        instance_id: { type: string }
        type: { type: string, enum: [create, transition, error, reconcile] }
        message: { type: string }
        occurred_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_failed, unauthorized, not_found, conflict, quota_exceeded, insufficient_capacity, runtime_error, internal_error] }
            message: { type: string }
            details: {}
